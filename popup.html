<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="appTitle">Miku Desktop Pet</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <section class="top-actions" aria-label="Quick actions" data-i18n-aria-label="quickActions">
        <button id="togglePlaybackButton" class="primary-action" type="button" aria-label="Pause Miku">Pause</button>
        <button id="addDomainButton" type="button">Hide Miku on this domain</button>
      </section>

      <header class="popup-header">
        <img src="assets/miku/shime1.png" alt="">
        <div>
          <h1 data-i18n="petName">Miku Pet</h1>
          <p id="saveStatus" role="status">Ready</p>
        </div>
      </header>

      <form id="settingsForm" class="settings-form">
        <label class="language-row" for="languageSelect">
          <strong data-i18n="language">Language</strong>
          <select id="languageSelect" name="language">
            <option value="en">English</option>
          </select>
        </label>
        <label class="range-row">
          <span><strong data-i18n="speed">Speed</strong><output id="speedOutput"></output></span>
          <input id="speedInput" name="speed" type="range" min="25" max="170" step="5">
        </label>
        <label class="range-row">
          <span><strong data-i18n="size">Size</strong><output id="sizeOutput"></output></span>
          <input id="sizeInput" name="size" type="range" min="64" max="140" step="4">
        </label>
        <label class="range-row">
          <span><strong data-i18n="jump">Jump chance</strong><output id="jumpOutput"></output></span>
          <input id="jumpInput" name="jump" type="range" min="0" max="100" step="5">
        </label>
        <label class="range-row">
          <span><strong data-i18n="interval">Walk interval</strong><output id="intervalOutput"></output></span>
          <input id="intervalInput" name="interval" type="range" min="1" max="12" step="0.5">
        </label>
        <label class="range-row">
          <span><strong data-i18n="idle">Standing time</strong><output id="idleOutput"></output></span>
          <input id="idleInput" name="idle" type="range" min="1" max="16" step="0.5">
        </label>
        <label class="range-row">
          <span><strong data-i18n="rest">Resting time</strong><output id="restOutput"></output></span>
          <input id="restInput" name="rest" type="range" min="1" max="12" step="0.5">
        </label>
      </form>

      <footer class="popup-actions">
        <button id="resetButton" type="button" data-i18n="reset">Reset</button>
        <button id="optionsButton" type="button" data-i18n="hiddenPages">Hidden pages</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>

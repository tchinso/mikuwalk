<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miku Desktop Pet Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options-shell">
      <header>
        <img src="assets/miku/shime11.png" alt="">
        <div>
          <h1>Hidden Pages</h1>
          <p>Keep Miku off matching URLs or domains.</p>
        </div>
      </header>

      <section class="editor-panel">
        <label for="blockedPages">Blocked pages</label>
        <textarea id="blockedPages" spellcheck="false" placeholder="example.com&#10;https://example.com/private*&#10;*://*.example.org/*"></textarea>
        <div class="actions">
          <button id="saveButton" type="button">Save</button>
          <button id="clearButton" type="button">Clear</button>
          <span id="saveStatus" role="status">Ready</span>
        </div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
